name: MinIO
description: S3-compatible object storage
category: storage
icon: "📦"

versions:
  - key: "latest"
    image: minio/minio:latest
    default_port: 9000
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_vars:
      MINIO_ROOT_USER: "${CONFIG_USER}"
      MINIO_ROOT_PASSWORD: "${CONFIG_PASSWORD}"
      TZ: "${GENERAL_TIMEZONE}"
    volumes:
      - "./data:/data"
    networks:
      - "${GENERAL_DEFAULT_NETWORK}"
    ports:
      - "${CONFIG_PORT}:9000"
      - "${CONFIG_PORT_CONSOLE}:9001"
    command: ["server", "/data", "--console-address", ":9001"]

config_fields:
  - key: port
    label: "API Port"
    type: number
    default: "9000"
    required: true
  - key: port_console
    label: "Console Port"
    type: number
    default: "9001"
    required: true
  - key: user
    label: "Root User"
    type: text
    default: "minioadmin"
    required: true
  - key: password
    label: "Root Password"
    type: password
    default: "minioadmin"
    required: true
